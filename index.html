<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторные работы</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #121212; 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            background: radial-gradient(circle at top, #2a2a35 0%, #121212 80%);
        }
        h1 { color: #bb86fc; margin-bottom: 40px; text-align: center; text-shadow: 0 2px 10px rgba(187, 134, 252, 0.3); }
        .menu-container { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; padding: 20px; }
        
        .card { 
            background-color: #1e1e1e; 
            border-radius: 16px; 
            padding: 40px 30px; 
            width: 280px; 
            text-align: center; 
            text-decoration: none; 
            color: #fff; 
            transition: transform 0.3s, box-shadow 0.3s; 
            border: 1px solid #333; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .card:hover { transform: translateY(-10px); }
        
        .card.meme:hover { box-shadow: 0 10px 25px rgba(187, 134, 252, 0.4); border-color: #bb86fc; }
        .card.halloween:hover { box-shadow: 0 10px 25px rgba(255, 117, 24, 0.4); border-color: #ff7518; }
        
        .card h2 { margin: 10px 0; font-size: 22px; }
        .card p { color: #aaa; font-size: 14px; line-height: 1.5; margin-bottom: 0; }
        .emoji { font-size: 55px; margin-bottom: 15px; display: block; }
    </style>
</head>
<body>

    <h1>Сборник проектов по Web-разработке</h1>
    
    <div class="menu-container">
        <a href="meme/index.html" class="card meme">
            <span class="emoji">🖼️</span>
            <h2>Генератор мемов</h2>
            <p>Лабораторная работа №1.<br>Динамический генератор на базе jQuery и JSON.</p>
        </a>

        <a href="halloween/index.html" class="card halloween">
            <span class="emoji">🎃</span>
            <h2>Жуткий урожай</h2>
            <p>Дополнительное задание.<br>Игра-тамагочи с динамической сложностью.</p>
        </a>
    </div>

</body>
</html>
